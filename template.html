<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>이력서 한 장 템플릿</title>
<style>
  body{margin:0;font-family:-apple-system,sans-serif;background:#0f1115;color:#e8eaed;line-height:1.55}
  main{max-width:720px;margin:0 auto;padding:32px 20px}
  a{color:#7c9cff} .card{background:#1a1d24;border:1px solid #2a2f3a;border-radius:12px;padding:16px;margin:12px 0}
  .muted{color:#9aa0a6} code{background:#12151b;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<main>
  <p><a href="./">← 스토어로</a></p>
  <h1>이력서 한 장 템플릿</h1>
  <p class="muted">복사해서 바로 쓰세요. 형용사 대신 숫자를 넣으면 통과율이 올라갑니다.</p>
  <div class="card">
    <h3>한 줄 소개</h3>
    <p>[직무] 지향 · [핵심 강점 1] · [숫자 있는 성과 1]</p>
  </div>
  <div class="card">
    <h3>경험 (STAR 압축)</h3>
    <p><strong>[역할] | [조직] | [기간]</strong></p>
    <ul>
      <li>상황/과제:</li>
      <li>내가 한 일: (동사로 시작)</li>
      <li>결과: (숫자/%/횟수)</li>
    </ul>
  </div>
  <div class="card">
    <h3>스킬</h3>
    <ul>
      <li>도구:</li>
      <li>언어/자격:</li>
    </ul>
  </div>
  <div class="card">
    <h3>작성 팁</h3>
    <ol>
      <li>형용사 금지, 숫자 우선</li>
      <li>팀 성과와 내 기여 분리</li>
      <li>지원 공고 키워드 2~3개를 문장에 넣기</li>
    </ol>
  </div>
  <p><a href="./">유료 첨삭 신청하기</a></p>
</main>
</body>
</html>
